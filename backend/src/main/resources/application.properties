spring.application.name=staff-management-portal
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:StaffManagementPortalSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2025}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

app.oauth2.authorized-redirect-url=${APP_OAUTH2_REDIRECT_URL:http://localhost:3000}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
